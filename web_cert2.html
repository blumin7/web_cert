<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>얼굴 인식 생체인증</title>
    <script async src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        button.danger {
            background: #ff6b6b;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .credentials-section {
            grid-column: 1 / -1;
        }

        .credentials-list {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        .credential-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .credential-info {
            flex: 1;
        }

        .credential-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .credential-meta {
            font-size: 12px;
            color: #999;
        }

        .credential-actions {
            display: flex;
            gap: 10px;
        }

        button.small {
            padding: 6px 12px;
            font-size: 12px;
            flex: none;
        }

        .empty-message {
            color: #999;
            text-align: center;
            padding: 30px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            padding: 20px;
            background: #f0f6ff;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .loading {
            display: none;
            text-align: center;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-box {
            padding: 12px;
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            font-size: 13px;
            color: #0066cc;
            margin-bottom: 15px;
        }

        .face-detection-info {
            font-size: 12px;
            color: #666;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .main-content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 얼굴 인식 생체인증</h1>
        <p class="subtitle">MediaPipe + IndexedDB를 이용한 얼굴 인식 기반 생체인증</p>

        <div class="main-content">
            <!-- 등록 섹션 -->
            <div class="section">
                <div class="section-title">📝 얼굴 등록</div>
                
                <div class="info-box">
                    <strong>📸 카메라 설정:</strong> 먼저 카메라를 시작해주세요
                </div>

                <div class="form-group">
                    <label for="registerName">사용자명</label>
                    <input type="text" id="registerName" placeholder="예: john_doe">
                </div>

                <div class="form-group">
                    <label for="registerEmail">이메일</label>
                    <input type="email" id="registerEmail" placeholder="예: john@example.com">
                </div>

                <div class="video-container" id="registerVideoContainer">
                    <video id="registerVideo" playsinline></video>
                    <canvas id="registerCanvas"></canvas>
                </div>

                <div class="face-detection-info" id="registerDetectionInfo">
                    준비 중...
                </div>

                <div class="button-group">
                    <button id="startRegisterCameraBtn">카메라 시작</button>
                    <button id="stopRegisterCameraBtn" disabled class="secondary">카메라 중지</button>
                </div>

                <button id="captureRegisterBtn" disabled>얼굴 촬영</button>

                <div id="registerStatus" class="status"></div>
            </div>

            <!-- 인증 섹션 -->
            <div class="section">
                <div class="section-title">🔑 얼굴 인증</div>
                
                <div class="info-box">
                    <strong>📸 카메라 설정:</strong> 먼저 카메라를 시작해주세요
                </div>

                <div class="form-group">
                    <label for="authName">사용자명</label>
                    <input type="text" id="authName" placeholder="등록한 사용자명">
                </div>

                <div class="video-container" id="authVideoContainer">
                    <video id="authVideo" playsinline></video>
                    <canvas id="authCanvas"></canvas>
                </div>

                <div class="face-detection-info" id="authDetectionInfo">
                    준비 중...
                </div>

                <div class="button-group">
                    <button id="startAuthCameraBtn">카메라 시작</button>
                    <button id="stopAuthCameraBtn" disabled class="secondary">카메라 중지</button>
                </div>

                <button id="captureAuthBtn" disabled>얼굴 촬영</button>

                <div id="authStatus" class="status"></div>
            </div>

            <!-- 기기 관리 섹션 -->
            <div class="section credentials-section">
                <div class="section-title">📱 등록된 얼굴</div>

                <div id="credentialsList" class="credentials-list">
                    <div class="empty-message">등록된 얼굴이 없습니다.</div>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-value" id="totalFaces">0</div>
                        <div class="stat-label">등록된 얼굴</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalUsers">0</div>
                        <div class="stat-label">등록된 사용자</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalAuth">0</div>
                        <div class="stat-label">성공한 인증</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // IndexedDB 관리
        // ============================================
        
        class FaceAuthDB {
            constructor() {
                this.dbName = 'FaceAuthDB';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);

                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve();
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        
                        if (!db.objectStoreNames.contains('faces')) {
                            const store = db.createObjectStore('faces', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('username', 'username', { unique: true });
                        }

                        if (!db.objectStoreNames.contains('embeddings')) {
                            const store = db.createObjectStore('embeddings', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('username', 'username', { unique: false });
                        }

                        if (!db.objectStoreNames.contains('stats')) {
                            db.createObjectStore('stats', { keyPath: 'key' });
                        }
                    };
                });
            }

            async saveFace(username, email, embeddingVector) {
                const encrypted = await this.encryptData(embeddingVector);
                
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['faces', 'embeddings'], 'readwrite');
                    
                    // 얼굴 정보 저장
                    const faceStore = transaction.objectStore('faces');
                    const faceData = {
                        username,
                        email,
                        registeredAt: new Date().toISOString(),
                        authCount: 0,
                        lastAuth: null,
                        isEncrypted: true
                    };

                    const faceRequest = faceStore.add(faceData);
                    
                    faceRequest.onsuccess = () => {
                        // 임베딩 벡터 저장
                        const embeddingStore = transaction.objectStore('embeddings');
                        const embeddingData = {
                            username,
                            vector: encrypted,
                            savedAt: new Date().toISOString()
                        };

                        const embeddingRequest = embeddingStore.add(embeddingData);
                        embeddingRequest.onsuccess = () => resolve(faceRequest.result);
                        embeddingRequest.onerror = () => reject(embeddingRequest.error);
                    };

                    faceRequest.onerror = () => reject(faceRequest.error);
                });
            }

            async getFaceByUsername(username) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['faces'], 'readonly');
                    const store = transaction.objectStore('faces');
                    const index = store.index('username');
                    const request = index.get(username);

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async getEmbeddingByUsername(username) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['embeddings'], 'readonly');
                    const store = transaction.objectStore('embeddings');
                    const index = store.index('username');
                    const request = index.get(username);

                    request.onsuccess = async () => {
                        if (request.result) {
                            const decrypted = await this.decryptData(request.result.vector);
                            resolve(decrypted);
                        } else {
                            resolve(null);
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            }

            async getAllFaces() {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['faces'], 'readonly');
                    const store = transaction.objectStore('faces');
                    const request = store.getAll();

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async deleteFace(username) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['faces', 'embeddings'], 'readwrite');
                    
                    // 얼굴 정보 삭제
                    const faceStore = transaction.objectStore('faces');
                    const faceIndex = faceStore.index('username');
                    const faceRequest = faceIndex.getKey(username);

                    faceRequest.onsuccess = () => {
                        if (faceRequest.result) {
                            faceStore.delete(faceRequest.result);
                        }

                        // 임베딩 정보 삭제
                        const embeddingStore = transaction.objectStore('embeddings');
                        const embeddingIndex = embeddingStore.index('username');
                        const embeddingRequest = embeddingIndex.openCursor(username);

                        embeddingRequest.onsuccess = (event) => {
                            const cursor = event.target.result;
                            if (cursor) {
                                cursor.delete();
                                cursor.continue();
                            } else {
                                resolve();
                            }
                        };
                        embeddingRequest.onerror = () => reject(embeddingRequest.error);
                    };

                    faceRequest.onerror = () => reject(faceRequest.error);
                });
            }

            async updateAuthCount(username) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['faces'], 'readwrite');
                    const store = transaction.objectStore('faces');
                    const index = store.index('username');
                    const getRequest = index.get(username);

                    getRequest.onsuccess = () => {
                        const face = getRequest.result;
                        if (face) {
                            face.authCount = (face.authCount || 0) + 1;
                            face.lastAuth = new Date().toISOString();
                            const updateRequest = store.put(face);
                            updateRequest.onsuccess = () => resolve();
                            updateRequest.onerror = () => reject(updateRequest.error);
                        }
                    };

                    getRequest.onerror = () => reject(getRequest.error);
                });
            }

            // Web Crypto를 이용한 AES-256-GCM 암호화
            async encryptData(vector) {
                try {
                    const key = await this.getOrCreateKey();
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    
                    const data = new TextEncoder().encode(JSON.stringify(vector));
                    
                    const encrypted = await crypto.subtle.encrypt(
                        {
                            name: 'AES-GCM',
                            iv: iv
                        },
                        key,
                        data
                    );

                    // IV와 암호문을 함께 반환
                    const combined = new Uint8Array(iv.length + encrypted.byteLength);
                    combined.set(iv, 0);
                    combined.set(new Uint8Array(encrypted), iv.length);

                    return Array.from(combined);
                } catch (error) {
                    console.error('암호화 실패:', error);
                    throw error;
                }
            }

            async decryptData(encryptedArray) {
                try {
                    const key = await this.getOrCreateKey();
                    const encryptedData = new Uint8Array(encryptedArray);
                    
                    const iv = encryptedData.slice(0, 12);
                    const encrypted = encryptedData.slice(12);

                    const decrypted = await crypto.subtle.decrypt(
                        {
                            name: 'AES-GCM',
                            iv: iv
                        },
                        key,
                        encrypted
                    );

                    return JSON.parse(new TextDecoder().decode(decrypted));
                } catch (error) {
                    console.error('복호화 실패:', error);
                    throw error;
                }
            }

            async getOrCreateKey() {
                let keyMaterial = localStorage.getItem('faceauth_key');
                
                if (!keyMaterial) {
                    const key = await crypto.subtle.generateKey(
                        { name: 'AES-GCM', length: 256 },
                        true,
                        ['encrypt', 'decrypt']
                    );

                    const exported = await crypto.subtle.exportKey('jwk', key);
                    keyMaterial = JSON.stringify(exported);
                    localStorage.setItem('faceauth_key', keyMaterial);
                }

                const jwk = JSON.parse(keyMaterial);
                return await crypto.subtle.importKey(
                    'jwk',
                    jwk,
                    { name: 'AES-GCM' },
                    false,
                    ['encrypt', 'decrypt']
                );
            }
        }

        // ============================================
        // 얼굴 감지 및 특징 추출
        // ============================================

        class FaceDetector {
            constructor() {
                this.detector = null;
                this.initialized = false;
            }

            async init() {
                if (this.initialized) return;

                try {
                    const vision = await window.Mediapipe.Tasks.Vision;
                    
                    this.detector = await vision.FaceDetector.createFromOptions(
                        { locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm/${file}` },
                        {
                            baseOptions: {
                                modelAssetPath: 'https://storage.googleapis.com/mediapipe-tasks/vision/face_detector/float16/1/face_detection.tflite'
                            },
                            runningMode: 'VIDEO',
                            minDetectionConfidence: 0.5
                        }
                    );

                    this.initialized = true;
                } catch (error) {
                    console.error('Face Detector 초기화 실패:', error);
                    throw error;
                }
            }

            async detectFace(videoElement) {
                if (!this.initialized) await this.init();

                try {
                    const result = this.detector.detectForVideo(videoElement, Date.now());
                    return result;
                } catch (error) {
                    console.error('얼굴 감지 실패:', error);
                    return null;
                }
            }
        }

        // ============================================
        // 특징 벡터 추출 (얼굴 정렬 + 간단한 특징)
        // ============================================

        class EmbeddingExtractor {
            // 얼굴 정렬 및 특징 벡터 추출
            extractEmbedding(canvas, detectionResult) {
                if (!detectionResult || !detectionResult.detections || detectionResult.detections.length === 0) {
                    return null;
                }

                const detection = detectionResult.detections[0];
                const keypoints = detection.keypoints || [];

                // 기준점이 충분한지 확인
                if (keypoints.length < 6) {
                    return null;
                }

                // 캔버스에서 픽셀 데이터 추출 (얼굴 영역)
                const ctx = canvas.getContext('2d');
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // 간단한 특징 벡터 생성 (L2 정규화된 128차원 벡터)
                const embedding = this.generateFeatureVector(imageData, keypoints);
                
                return embedding;
            }

            generateFeatureVector(imageData, keypoints) {
                const data = imageData.data;
                const vector = new Float32Array(128);

                // 밝기 특징 추출
                for (let i = 0; i < 32; i++) {
                    let sum = 0;
                    const pixelCount = Math.floor(data.length / 4 / 32);
                    for (let j = 0; j < pixelCount; j++) {
                        const pixelIndex = (i * pixelCount + j) * 4;
                        const brightness = (data[pixelIndex] + data[pixelIndex + 1] + data[pixelIndex + 2]) / 3;
                        sum += brightness;
                    }
                    vector[i] = sum / pixelCount / 255;
                }

                // 기준점 정규화 특징
                if (keypoints.length >= 6) {
                    for (let i = 0; i < Math.min(keypoints.length, 6); i++) {
                        const kp = keypoints[i];
                        vector[32 + i * 2] = kp.x;
                        vector[32 + i * 2 + 1] = kp.y;
                    }
                }

                // 랜덤 특징 (프로토타입용)
                for (let i = 96; i < 128; i++) {
                    vector[i] = Math.random();
                }

                // L2 정규화
                return this.l2Normalize(vector);
            }

            l2Normalize(vector) {
                let sum = 0;
                for (let v of vector) {
                    sum += v * v;
                }
                const norm = Math.sqrt(sum);
                if (norm > 0) {
                    for (let i = 0; i < vector.length; i++) {
                        vector[i] /= norm;
                    }
                }
                return Array.from(vector);
            }

            // 코사인 유사도 계산
            cosineSimilarity(vec1, vec2) {
                if (!vec1 || !vec2 || vec1.length !== vec2.length) {
                    return 0;
                }

                let dotProduct = 0;
                let norm1 = 0;
                let norm2 = 0;

                for (let i = 0; i < vec1.length; i++) {
                    dotProduct += vec1[i] * vec2[i];
                    norm1 += vec1[i] * vec1[i];
                    norm2 += vec2[i] * vec2[i];
                }

                norm1 = Math.sqrt(norm1);
                norm2 = Math.sqrt(norm2);

                if (norm1 === 0 || norm2 === 0) {
                    return 0;
                }

                return dotProduct / (norm1 * norm2);
            }
        }

        // ============================================
        // UI 관리자
        // ============================================

        class UIManager {
            showStatus(elementId, type, message) {
                const element = document.getElementById(elementId);
                element.className = `status show ${type}`;
                element.textContent = message;
            }

            hideStatus(elementId) {
                const element = document.getElementById(elementId);
                element.className = 'status';
            }

            updateDetectionInfo(elementId, message) {
                document.getElementById(elementId).textContent = message;
            }

            async updateCredentialsList(faces) {
                const listElement = document.getElementById('credentialsList');

                if (!faces || faces.length === 0) {
                    listElement.innerHTML = '<div class="empty-message">등록된 얼굴이 없습니다.</div>';
                    this.updateStats(0, 0, 0);
                    return;
                }

                let html = '';
                for (const face of faces) {
                    const registeredDate = new Date(face.registeredAt).toLocaleString('ko-KR');
                    const lastAuth = face.lastAuth ? new Date(face.lastAuth).toLocaleString('ko-KR') : '없음';

                    html += `
                        <div class="credential-item">
                            <div class="credential-info">
                                <div class="credential-name">👤 ${this.escapeHtml(face.username)}</div>
                                <div class="credential-meta">
                                    📧 ${this.escapeHtml(face.email)}<br>
                                    📅 등록: ${registeredDate}<br>
                                    🔑 마지막 인증: ${lastAuth} (${face.authCount || 0}회)
                                </div>
                            </div>
                            <div class="credential-actions">
                                <button class="small danger" onclick="app.deleteFace('${this.escapeHtml(face.username)}')">
                                    삭제
                                </button>
                            </div>
                        </div>
                    `;
                }
                listElement.innerHTML = html;

                // 통계 업데이트
                const uniqueUsers = new Set(faces.map(f => f.username)).size;
                const totalAuth = faces.reduce((sum, f) => sum + (f.authCount || 0), 0);
                this.updateStats(faces.length, uniqueUsers, totalAuth);
            }

            updateStats(totalFaces, totalUsers, totalAuth) {
                document.getElementById('totalFaces').textContent = totalFaces;
                document.getElementById('totalUsers').textContent = totalUsers;
                document.getElementById('totalAuth').textContent = totalAuth;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // ============================================
        // 메인 애플리케이션
        // ============================================

        class FaceAuthApp {
            constructor() {
                this.db = new FaceAuthDB();
                this.faceDetector = new FaceDetector();
                this.embeddingExtractor = new EmbeddingExtractor();
                this.ui = new UIManager();
                
                this.registerStream = null;
                this.authStream = null;
                this.registerDetectionRunning = false;
                this.authDetectionRunning = false;
                
                this.failedAttempts = 0;
                this.maxFailedAttempts = 5;
            }

            async init() {
                try {
                    await this.db.init();
                    console.log('✅ 데이터베이스 초기화 완료');

                    // MediaPipe 대기
                    let attempts = 0;
                    while (!window.Mediapipe && attempts < 50) {
                        await new Promise(r => setTimeout(r, 100));
                        attempts++;
                    }

                    if (window.Mediapipe) {
                        await this.faceDetector.init();
                        console.log('✅ Face Detector 초기화 완료');
                    } else {
                        console.warn('⚠️ MediaPipe 로드 실패');
                    }

                    this.attachEventListeners();
                    await this.updateUI();
                } catch (error) {
                    console.error('초기화 실패:', error);
                    this.ui.showStatus('registerStatus', 'error', '초기화 실패: ' + error.message);
                }
            }

            attachEventListeners() {
                // 등록 카메라
                document.getElementById('startRegisterCameraBtn').addEventListener('click', () => this.startCamera('register'));
                document.getElementById('stopRegisterCameraBtn').addEventListener('click', () => this.stopCamera('register'));
                document.getElementById('captureRegisterBtn').addEventListener('click', () => this.captureRegister());

                // 인증 카메라
                document.getElementById('startAuthCameraBtn').addEventListener('click', () => this.startCamera('auth'));
                document.getElementById('stopAuthCameraBtn').addEventListener('click', () => this.stopCamera('auth'));
                document.getElementById('captureAuthBtn').addEventListener('click', () => this.captureAuth());
            }

            async startCamera(type) {
                try {
                    const constraints = {
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: 'user'
                        },
                        audio: false
                    };

                    const stream = await navigator.mediaDevices.getUserMedia(constraints);

                    const videoElement = type === 'register' 
                        ? document.getElementById('registerVideo')
                        : document.getElementById('authVideo');

                    videoElement.srcObject = stream;

                    if (type === 'register') {
                        this.registerStream = stream;
                        this.registerDetectionRunning = true;
                        this.runDetection('register');
                    } else {
                        this.authStream = stream;
                        this.authDetectionRunning = true;
                        this.runDetection('auth');
                    }

                    const startBtn = document.getElementById(`start${type.charAt(0).toUpperCase() + type.slice(1)}CameraBtn`);
                    const stopBtn = document.getElementById(`stop${type.charAt(0).toUpperCase() + type.slice(1)}CameraBtn`);
                    const captureBtn = document.getElementById(`capture${type.charAt(0).toUpperCase() + type.slice(1)}Btn`);

                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    captureBtn.disabled = false;

                    this.ui.updateDetectionInfo(`${type}DetectionInfo`, '얼굴 감지 중...');
                } catch (error) {
                    const statusId = type === 'register' ? 'registerStatus' : 'authStatus';
                    this.ui.showStatus(statusId, 'error', '카메라 접근 실패: ' + error.message);
                    console.error('카메라 접근 실패:', error);
                }
            }

            stopCamera(type) {
                const stream = type === 'register' ? this.registerStream : this.authStream;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                if (type === 'register') {
                    this.registerDetectionRunning = false;
                    document.getElementById('registerVideo').srcObject = null;
                } else {
                    this.authDetectionRunning = false;
                    document.getElementById('authVideo').srcObject = null;
                }

                const startBtn = document.getElementById(`start${type.charAt(0).toUpperCase() + type.slice(1)}CameraBtn`);
                const stopBtn = document.getElementById(`stop${type.charAt(0).toUpperCase() + type.slice(1)}CameraBtn`);
                const captureBtn = document.getElementById(`capture${type.charAt(0).toUpperCase() + type.slice(1)}Btn`);

                startBtn.disabled = false;
                stopBtn.disabled = true;
                captureBtn.disabled = true;

                this.ui.updateDetectionInfo(`${type}DetectionInfo`, '카메라 중지됨');
            }

            async runDetection(type) {
                const videoElement = type === 'register' 
                    ? document.getElementById('registerVideo')
                    : document.getElementById('authVideo');
                const canvasElement = type === 'register'
                    ? document.getElementById('registerCanvas')
                    : document.getElementById('authCanvas');

                const isRunning = type === 'register' 
                    ? () => this.registerDetectionRunning
                    : () => this.authDetectionRunning;

                const updateInfo = (msg) => this.ui.updateDetectionInfo(`${type}DetectionInfo`, msg);

                if (!videoElement.videoWidth) {
                    setTimeout(() => this.runDetection(type), 100);
                    return;
                }

                // 캔버스 설정
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;

                const detectFrame = async () => {
                    if (!isRunning()) return;

                    try {
                        const result = await this.faceDetector.detectFace(videoElement);

                        const ctx = canvasElement.getContext('2d');
                        ctx.fillStyle = 'rgba(0, 0, 0, 0)';
                        ctx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                        if (result && result.detections && result.detections.length > 0) {
                            const detection = result.detections[0];
                            
                            // 얼굴 박스 그리기
                            const box = detection.boundingBox;
                            ctx.strokeStyle = '#667eea';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(
                                box.originX * canvasElement.width,
                                box.originY * canvasElement.height,
                                box.width * canvasElement.width,
                                box.height * canvasElement.height
                            );

                            // 기준점 그리기
                            if (detection.keypoints) {
                                ctx.fillStyle = '#ff6b6b';
                                detection.keypoints.forEach(kp => {
                                    ctx.fillRect(
                                        kp.x * canvasElement.width - 3,
                                        kp.y * canvasElement.height - 3,
                                        6, 6
                                    );
                                });
                            }

                            updateInfo(`✅ 얼굴 감지됨 (신뢰도: ${(detection.detectionConfidence * 100).toFixed(1)}%)`);
                        } else {
                            updateInfo('⚠️ 얼굴을 찾을 수 없습니다. 카메라를 정면을 향하세요.');
                        }
                    } catch (error) {
                        console.error('감지 오류:', error);
                        updateInfo('❌ 감지 오류 발생');
                    }

                    requestAnimationFrame(detectFrame);
                };

                detectFrame();
            }

            async captureRegister() {
                const username = document.getElementById('registerName').value.trim();
                const email = document.getElementById('registerEmail').value.trim();

                if (!username || !email) {
                    this.ui.showStatus('registerStatus', 'error', '사용자명과 이메일을 입력하세요.');
                    return;
                }

                // 중복 확인
                const existing = await this.db.getFaceByUsername(username);
                if (existing) {
                    this.ui.showStatus('registerStatus', 'error', `'${username}'은(는) 이미 등록되어 있습니다.`);
                    return;
                }

                try {
                    this.ui.showStatus('registerStatus', 'info', '얼굴을 촬영 중입니다...');

                    const videoElement = document.getElementById('registerVideo');
                    const canvasElement = document.getElementById('registerCanvas');

                    // 비디오에서 이미지 캡처
                    const captureCanvas = document.createElement('canvas');
                    captureCanvas.width = videoElement.videoWidth;
                    captureCanvas.height = videoElement.videoHeight;
                    const ctx = captureCanvas.getContext('2d');
                    ctx.drawImage(videoElement, 0, 0);

                    // 얼굴 감지
                    const detectionResult = await this.faceDetector.detectFace(videoElement);

                    if (!detectionResult || !detectionResult.detections || detectionResult.detections.length === 0) {
                        this.ui.showStatus('registerStatus', 'error', '얼굴을 감지할 수 없습니다. 다시 시도해주세요.');
                        return;
                    }

                    // 특징 벡터 추출
                    const embedding = this.embeddingExtractor.extractEmbedding(captureCanvas, detectionResult);

                    if (!embedding) {
                        this.ui.showStatus('registerStatus', 'error', '얼굴 특징을 추출할 수 없습니다. 다시 시도해주세요.');
                        return;
                    }

                    // 데이터베이스에 저장
                    await this.db.saveFace(username, email, embedding);

                    this.ui.showStatus('registerStatus', 'success', 
                        `✅ '${username}' 사용자의 얼굴이 등록되었습니다!`);

                    document.getElementById('registerName').value = '';
                    document.getElementById('registerEmail').value = '';

                    await this.updateUI();
                } catch (error) {
                    console.error('등록 실패:', error);
                    this.ui.showStatus('registerStatus', 'error', '등록 실패: ' + error.message);
                }
            }

            async captureAuth() {
                const username = document.getElementById('authName').value.trim();

                if (!username) {
                    this.ui.showStatus('authStatus', 'error', '사용자명을 입력하세요.');
                    return;
                }

                // 실패 횟수 확인
                if (this.failedAttempts >= this.maxFailedAttempts) {
                    this.ui.showStatus('authStatus', 'error', 
                        `${this.maxFailedAttempts}회 실패했습니다. 잠시 후 다시 시도해주세요.`);
                    return;
                }

                try {
                    this.ui.showStatus('authStatus', 'info', '얼굴을 인증 중입니다...');

                    const videoElement = document.getElementById('authVideo');
                    const captureCanvas = document.createElement('canvas');
                    captureCanvas.width = videoElement.videoWidth;
                    captureCanvas.height = videoElement.videoHeight;
                    const ctx = captureCanvas.getContext('2d');
                    ctx.drawImage(videoElement, 0, 0);

                    // 얼굴 감지
                    const detectionResult = await this.faceDetector.detectFace(videoElement);

                    if (!detectionResult || !detectionResult.detections || detectionResult.detections.length === 0) {
                        this.ui.showStatus('authStatus', 'error', '얼굴을 감지할 수 없습니다. 다시 시도해주세요.');
                        return;
                    }

                    // 특징 벡터 추출
                    const currentEmbedding = this.embeddingExtractor.extractEmbedding(captureCanvas, detectionResult);

                    if (!currentEmbedding) {
                        this.ui.showStatus('authStatus', 'error', '얼굴 특징을 추출할 수 없습니다. 다시 시도해주세요.');
                        return;
                    }

                    // 저장된 임베딩 조회
                    const storedEmbedding = await this.db.getEmbeddingByUsername(username);

                    if (!storedEmbedding) {
                        this.ui.showStatus('authStatus', 'error', `'${username}'로 등록된 얼굴이 없습니다.`);
                        this.failedAttempts++;
                        return;
                    }

                    // 유사도 계산
                    const similarity = this.embeddingExtractor.cosineSimilarity(currentEmbedding, storedEmbedding);
                    const threshold = 0.6;

                    console.log(`유사도: ${(similarity * 100).toFixed(2)}%`);

                    if (similarity > threshold) {
                        // 인증 성공
                        await this.db.updateAuthCount(username);
                        this.failedAttempts = 0;

                        const face = await this.db.getFaceByUsername(username);
                        this.ui.showStatus('authStatus', 'success', 
                            `✅ 인증 성공! '${username}' 사용자입니다.\n유사도: ${(similarity * 100).toFixed(2)}%`);

                        document.getElementById('authName').value = '';
                        await this.updateUI();
                    } else {
                        // 인증 실패
                        this.failedAttempts++;
                        const remainingAttempts = this.maxFailedAttempts - this.failedAttempts;
                        this.ui.showStatus('authStatus', 'error', 
                            `❌ 인증 실패. 유사도: ${(similarity * 100).toFixed(2)}%\n남은 시도: ${remainingAttempts}회`);
                    }
                } catch (error) {
                    console.error('인증 실패:', error);
                    this.ui.showStatus('authStatus', 'error', '인증 실패: ' + error.message);
                    this.failedAttempts++;
                }
            }

            async deleteFace(username) {
                if (!confirm(`'${username}'의 얼굴을 삭제하시겠습니까?`)) {
                    return;
                }

                try {
                    await this.db.deleteFace(username);
                    this.ui.showStatus('registerStatus', 'success', `'${username}'의 얼굴이 삭제되었습니다.`);
                    await this.updateUI();
                } catch (error) {
                    this.ui.showStatus('registerStatus', 'error', '삭제 실패: ' + error.message);
                }
            }

            async updateUI() {
                const faces = await this.db.getAllFaces();
                await this.ui.updateCredentialsList(faces);
            }
        }

        // ============================================
        // 초기화
        // ============================================

        let app;

        document.addEventListener('DOMContentLoaded', async () => {
            app = new FaceAuthApp();
            await app.init();
        });
    </script>
