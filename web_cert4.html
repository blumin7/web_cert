<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>web_cert4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; gap: 16px; justify-content: center; padding: 24px; }
  button { flex: 1; max-height: 160px; font-size: 24px; border: 1px solid #000; background: #fff; border-radius: 0; }
  button:active { background: #eee; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<button id="btnRegister" type="button">등록</button>
<button id="btnAuth" type="button">인증</button>

<script>
/*
 * 네이티브 브리지 규약
 *  웹 → 네이티브
 *    Android: window.NativeCert.register() / window.NativeCert.authenticate()   (addJavascriptInterface 이름: NativeCert)
 *    iOS    : window.webkit.messageHandlers.nativeCert.postMessage({ action: 'register' | 'authenticate' })
 *  네이티브 → 웹 (작업 완료 시 반드시 1회 호출)
 *    window.onNativeCert(action, ok, message)
 *  브리지가 없으면(일반 브라우저) WebAuthn으로 폴백한다.
 */
const KEY = 'web_cert4_credential';
const NATIVE_TIMEOUT_MS = 90000;
const buttons = [btnRegister, btnAuth];

const hasAndroid = () => !!(window.NativeCert && window.NativeCert.register);
const hasIos = () => !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeCert);
const hasNative = () => hasAndroid() || hasIos();

let pending = null;
window.onNativeCert = (action, ok, message) => {
  if (!pending || pending.action !== action) return;
  const p = pending; pending = null; clearTimeout(p.timer);
  ok ? p.resolve(message) : p.reject(new Error(message || '실패'));
};

function callNative(action) {
  return new Promise((resolve, reject) => {
    if (pending) { reject(new Error('이미 진행 중입니다.')); return; }
    const timer = setTimeout(() => { pending = null; reject(new Error('시간이 초과되었습니다.')); }, NATIVE_TIMEOUT_MS);
    pending = { action, resolve, reject, timer };
    try {
      if (hasAndroid()) window.NativeCert[action]();
      else window.webkit.messageHandlers.nativeCert.postMessage({ action });
    } catch (e) { pending = null; clearTimeout(timer); reject(e); }
  });
}

/* WebAuthn 폴백 */
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));

async function webRegister() {
  if (!window.PublicKeyCredential) throw new Error('이 기기는 생체인증을 지원하지 않습니다.');
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: rand(32),
      rp: { name: 'web_cert4', id: location.hostname },
      user: { id: rand(16), name: 'user', displayName: 'user' },
      pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
      authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
      timeout: 60000,
    },
  });
  if (!cred) throw new Error('취소되었습니다.');
  localStorage.setItem(KEY, b64(cred.rawId));
}
async function webAuthenticate() {
  if (!window.PublicKeyCredential) throw new Error('이 기기는 생체인증을 지원하지 않습니다.');
  const id = localStorage.getItem(KEY);
  if (!id) throw new Error('등록된 인증 정보가 없습니다. 먼저 등록하세요.');
  const a = await navigator.credentials.get({
    publicKey: {
      challenge: rand(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
      allowCredentials: [{ id: unb64(id), type: 'public-key', transports: ['internal'] }],
    },
  });
  if (!a) throw new Error('취소되었습니다.');
}

async function run(action, successMsg) {
  buttons.forEach((b) => (b.disabled = true));
  try {
    if (hasNative()) await callNative(action);
    else await (action === 'register' ? webRegister() : webAuthenticate());
    alert(successMsg);
  } catch (e) {
    alert(e.name === 'NotAllowedError' ? '취소되었거나 거부되었습니다.' : e.message);
  } finally {
    buttons.forEach((b) => (b.disabled = false));
  }
}

btnRegister.onclick = () => run('register', '등록 완료');
btnAuth.onclick = () => run('authenticate', '인증 성공');
</script>
</body>
</html>
