<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>web_cert3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; gap: 16px; justify-content: center; padding: 24px; }
  button { flex: 1; max-height: 160px; font-size: 24px; border: 1px solid #000; background: #fff; border-radius: 0; }
  button:active { background: #eee; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<button id="btnRegister" type="button">등록</button>
<button id="btnAuth" type="button">인증</button>

<script>
const KEY = 'web_cert3_credential';
const buttons = [btnRegister, btnAuth];
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const rand = (n) => crypto.getRandomValues(new Uint8Array(n));

async function run(fn) {
  if (!window.PublicKeyCredential) { alert('이 기기는 생체인증(WebAuthn)을 지원하지 않습니다.'); return; }
  buttons.forEach((b) => (b.disabled = true));
  try { await fn(); }
  catch (e) { alert(e.name === 'NotAllowedError' ? '취소되었거나 거부되었습니다.' : e.name + ': ' + e.message); }
  finally { buttons.forEach((b) => (b.disabled = false)); }
}

btnRegister.onclick = () => run(async () => {
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: rand(32),
      rp: { name: 'web_cert3', id: location.hostname },
      user: { id: rand(16), name: 'user', displayName: 'user' },
      pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
      authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
      timeout: 60000,
    },
  });
  if (!cred) return;
  localStorage.setItem(KEY, b64(cred.rawId));
  alert('등록 완료');
});

btnAuth.onclick = () => run(async () => {
  const id = localStorage.getItem(KEY);
  if (!id) { alert('등록된 인증 정보가 없습니다. 먼저 등록하세요.'); return; }
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge: rand(32),
      rpId: location.hostname,
      allowCredentials: [{ id: unb64(id), type: 'public-key', transports: ['internal'] }],
      userVerification: 'required',
      timeout: 60000,
    },
  });
  if (assertion) alert('인증 성공');
});
</script>
</body>
</html>
